name: HarnessMM Windows A-B

on:
  pull_request:
    paths:
      - patches/harnessmm/**
      - scripts/*harnessmm*
      - .github/workflows/harnessmm-ab.yml
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: Exact upstream SHA shared by both arms
        type: string
        default: 67f0994b532b8740f14b5b738af7b7b2a915b1d6
        required: true
      build_timestamp:
        description: Shared version timestamp for this reproducible experiment
        type: string
        default: '2026-11-02T16:54:00Z'
        required: true
      variant:
        description: Rebuild one arm when the other verified source is unchanged
        type: choice
        options: [both, baseline, harnessmm]
        default: both

permissions:
  contents: read

concurrency:
  group: harnessmm-ab-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_TERM_COLOR: always
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  source-contracts:
    strategy:
      fail-fast: false
      matrix:
        ref: [67f0994b532b8740f14b5b738af7b7b2a915b1d6, main]
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: openai/codex
          ref: ${{ matrix.ref }}
          path: out/source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - shell: pwsh
        run: |
          git -C out/source rev-parse HEAD
          ./scripts/patch-codex-windows-custom.ps1 -SourceRoot out/source
          python scripts/test-harnessmm-patch.py --source-root out/source
          if ($LASTEXITCODE -ne 0) { throw 'HarnessMM exact-source contracts failed.' }
          python scripts/patch-codex-harnessmm.py --source-root out/source
          if ($LASTEXITCODE -ne 0) { throw 'HarnessMM source patch failed.' }
          python scripts/patch-codex-harnessmm.py --source-root out/source
          if ($LASTEXITCODE -ne 0) { throw 'HarnessMM replay failed.' }
  freeze:
    runs-on: ubuntu-latest
    outputs:
      upstream: ${{ steps.freeze.outputs.upstream }}
      timestamp: ${{ steps.freeze.outputs.timestamp }}
    steps:
      - id: freeze
        env:
          UPSTREAM: ${{ inputs.upstream_sha || '67f0994b532b8740f14b5b738af7b7b2a915b1d6' }}
          BUILD_TIMESTAMP: ${{ inputs.build_timestamp || '2026-11-02T16:54:00Z' }}
        run: |
          [[ "$UPSTREAM" =~ ^[a-f0-9]{40}$ ]] || exit 1
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          [[ "$BUILD_TIMESTAMP" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:00Z$ ]] || exit 1
          echo "timestamp=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"

  build:
    needs: freeze
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variant == 'baseline' && '["baseline"]' || inputs.variant == 'harnessmm' && '["harnessmm"]' || '["baseline","harnessmm"]') }}
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      CARGO_HOME: D:/c
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare tools and source contracts
        shell: pwsh
        run: |
          git config --global core.longpaths true
          rustup target add x86_64-pc-windows-msvc
          python -m pip install 'pywinpty>=2,<4'
          python scripts/test-harnessmm-patch.py
          if ($LASTEXITCODE -ne 0) { throw 'HarnessMM patch contracts failed.' }
      - uses: actions/cache/restore@v4
        id: cache
        timeout-minutes: 10
        continue-on-error: true
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            out/codex-upstream/codex-rs/target
            out/rusty-v8
          key: harnessmm-ab-v1-${{ matrix.variant }}-${{ needs.freeze.outputs.upstream }}-${{ hashFiles('patches/harnessmm/**', 'scripts/*harnessmm*') }}
          restore-keys: |
            harnessmm-ab-v1-${{ matrix.variant }}-${{ needs.freeze.outputs.upstream }}-
            harnessmm-ab-v1-baseline-${{ needs.freeze.outputs.upstream }}-
            windows-codex-custom-cargo-v2-shortpaths-${{ runner.os }}-
      - name: Build and validate exact arm
        id: build
        shell: pwsh
        timeout-minutes: 205
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM: ${{ needs.freeze.outputs.upstream }}
          BUILD_TIMESTAMP: ${{ needs.freeze.outputs.timestamp }}
          VARIANT: ${{ matrix.variant }}
        run: |
          $args = @{UpstreamRef=$env:UPSTREAM; Force=$true; BuildTimestamp=[DateTimeOffset]::Parse($env:BUILD_TIMESTAMP)}
          if ($env:VARIANT -eq 'baseline') { $args.WithoutHarnessMm=$true }
          ./scripts/sync-codex-windows-custom.ps1 @args
          $manifest = Get-ChildItem out -Filter '*.manifest.json' -File | Select-Object -First 1
          if (-not $manifest) { throw 'Missing build manifest.' }
          $value = Get-Content -Raw -LiteralPath $manifest.FullName | ConvertFrom-Json
          if ($value.patch_status -ne 'applied' -or $value.upstream_sha -ne $env:UPSTREAM) { throw 'Arm source/patch mismatch.' }
          if ([bool]$value.harnessmm.included -ne ($env:VARIANT -eq 'harnessmm')) { throw 'Wrong compiled arm.' }
          $source = Join-Path $PWD 'out/codex-upstream'
          if ($env:VARIANT -eq 'harnessmm') {
            python scripts/test-harnessmm-patch.py --source-root $source
            if ($LASTEXITCODE -ne 0) { throw 'Exact-source HarnessMM contracts failed.' }
          }
      - name: Retain build and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harnessmm-ab-${{ matrix.variant }}
          path: |
            out/*.zip
            out/*.manifest.json
            out/*test-selection.json
            out/custom-*/**/*checks.json
          if-no-files-found: error
      - uses: actions/cache/save@v4
        if: success() && steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 20
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            out/codex-upstream/codex-rs/target
            out/rusty-v8
          key: ${{ steps.cache.outputs.cache-primary-key }}
